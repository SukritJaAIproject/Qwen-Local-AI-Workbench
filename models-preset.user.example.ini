; models-preset.user.example.ini -> copy to C:\LLM\models-preset.user.ini to override the automatic GPU plan.
;
; The launcher (start-qwen38.ps1) runs gpu_profile.py on every start. gpu_profile.py detects the GPUs,
; writes C:\LLM\models-preset.ini (generated, do not edit) and merges this file on top of it.
; Priority: automatic plan < gpu-choice.json (the "Choose GPU..." dialog) < models-preset.user.ini
;
; Rules learned the hard way with llama.cpp b10984 router mode:
;   * save WITHOUT a UTF-8 BOM - a BOM makes llama-server exit immediately
;   * a section for a model that does not exist shows up as a broken "ghost" model in the list
;   * options given on the router's own command line always win over the preset
;   * keys are llama-server long options without the leading dashes
;
; Section names are model ids = GGUF file names without ".gguf".

[*]
; applies to every model unless a model section overrides it
; threads = 6

[Qwen3.8-27B-UD-Q4_K_M]
; 64K context + vision. On a 24 GB card the whole model fits; on a 6 GB laptop GPU it is partly offloaded.
ctx-size = 65536
mmproj = C:\LLM\models\mmproj-Qwen3.8-27B-F16.gguf
image-max-tokens = 768

; [Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL]
; use the external GPU first, then the internal one (CUDA ids follow PCI bus order)
; device = CUDA1,CUDA0
