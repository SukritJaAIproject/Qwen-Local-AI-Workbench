name: Bug report / แจ้งปัญหา
description: Something in the workbench does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying the workbench. Thai or English are both fine. / ขอบคุณที่ช่วยทดลองใช้ เขียนเป็นภาษาไทยหรืออังกฤษก็ได้

        **Please do not paste tokens, chats or private documents.** This issue is public.
        **กรุณาอย่าแปะ token แชต หรือเอกสารส่วนตัว** เพราะ issue นี้เป็นสาธารณะ
  - type: input
    id: version
    attributes:
      label: Version or commit / เวอร์ชันหรือ commit
      placeholder: "v1.0.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows, GPU and llama.cpp build / Windows การ์ดจอ และ build ของ llama.cpp
      placeholder: "Windows 11 24H2, RTX 4060 8 GB, llama.cpp b10984"
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen? / เกิดที่ส่วนไหน
      options:
        - Install or launcher / การติดตั้งหรือตัวเปิดโปรแกรม
        - Chat and projects / แชตและโปรเจกต์
        - Tools and confirmation (MCP) / เครื่องมือและการยืนยัน
        - Documents, OCR or search / เอกสาร OCR หรือการค้นหา
        - Voice input / พิมพ์ด้วยเสียง
        - GPU placement or eGPU / การจัดการ์ดจอ
        - Usage or health dashboards / แดชบอร์ด
        - Other / อื่น ๆ
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / เกิดอะไรขึ้น
      description: Include any error message you saw. / ใส่ข้อความ error ที่เห็นด้วย
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / ขั้นตอนที่ทำให้เกิดปัญหา
      placeholder: |
        1. Open a project
        2. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / ผลที่คาดว่าจะได้
  - type: textarea
    id: logs
    attributes:
      label: Log / บันทึกการทำงาน
      description: The relevant lines from the hub or launcher log. Remove tokens and anything private first. / ส่วนที่เกี่ยวข้องจาก log (ลบ token และข้อมูลส่วนตัวออกก่อน)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / ความเป็นส่วนตัว
      options:
        - label: I did not paste tokens, chats or private documents. / ฉันไม่ได้แปะ token แชต หรือเอกสารส่วนตัว
          required: true
