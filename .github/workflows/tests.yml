name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      # Several tests check that files keep LF line endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The code expects to live in C:\LLM and Python in C:\Python313 (see #2).
      # Copy the checkout there: a junction would change the paths the guard resolves.
      - name: Install into the expected paths
        shell: pwsh
        run: |
          robocopy $env:GITHUB_WORKSPACE C:\LLM /E /XD .git /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          New-Item -ItemType Junction -Path C:\Python313 -Target $env:pythonLocation | Out-Null
          exit 0
      - name: Run tests
        shell: python
        run: |
          import sys
          import unittest

          # Parts of the local stack that a CI runner does not have.
          SKIP_MODULES = {
              "test_docs_ocr": "Tesseract OCR",
              "test_docs_ocr_fixes": "Tesseract OCR",
              "test_exec_python": "the Anaconda tool kernel",
              "test_confirm_review": "the Anaconda tool kernel",
              "test_docs_semantic": "the live Qwen3-Embedding service",
          }
          SKIP_TESTS = {
              "test_broad_acl_detection": "the C:\\ ACLs of a normal Windows install",
          }

          def flatten(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from flatten(test)
                  else:
                      yield test

          def module_of(test):
              if type(test).__name__ == "_FailedTest":
                  return test._testMethodName
              return type(test).__module__.split(".")[0]

          found = list(flatten(unittest.defaultTestLoader.discover(r"C:\LLM\tests")))
          kept = [t for t in found
                  if module_of(t) not in SKIP_MODULES
                  and getattr(t, "_testMethodName", "") not in SKIP_TESTS]
          for name, why in {**SKIP_MODULES, **SKIP_TESTS}.items():
              print(f"not run in CI: {name} (needs {why})")
          print(f"running {len(kept)} of {len(found)} tests")
          result = unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(kept))
          sys.exit(0 if result.wasSuccessful() else 1)
